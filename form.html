
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원정보 입력</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px 13px;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }

        .form-box {
            width: 360px;
            max-width: 100%;
            padding: 18px 16px 16px;
            border: 1px solid #dddddd;
            border-radius: 9px;
            background-color: #fcfcfc;
        }

        h2 {
            margin: 0 0 16px;
            font-size: 19px;
            font-weight: bold;
            color: #111111;
        }

        .form-group {
            margin-bottom: 13px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #555555;
        }

        input {
            width: 100%;
            height: 40px;
            padding: 0 18px;
            border: 1px solid #d6d6d6;
            border-radius: 22px;
            background-color: transparent;
            font-size: 16px;
            outline: none;
        }

        input::placeholder {
            color: #999999;
        }

        input:focus {
            border-color: #888888;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        #button1 {
            flex: 1;
            height: 36px;
            border-radius: 22px;
            font-size: 12px;
            cursor: pointer;
        }
        #button2 {
            flex: 1;
            height: 36px;
            border-radius: 22px;
            font-size: 100px;
            cursor: pointer;
        }

        .submit-btn {
            background-color: #111111;
            color: white;
            border: none;
        }

        #reset-btn {
            background-color: transparent;
            color: #666666;
            border: 1px solid #d6d6d6;
        }

 
    </style>
</head>

<body>
    <div class="form-box">
        <h2>회원정보 입력</h2>

        <form action="/register" method="post">

            <div class="form-group">
                <label for="userid">아이디</label>
                <input type="text"
                       id="userid"
                       name="userid"
                       placeholder="아이디 입력"
                       required>
            </div>

            <div class="form-group">
                <label for="password">암호</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="암호 입력"
                       required>
            </div>

            <div class="form-group">
                <label for="age">나이</label>
                <input type="number"
                       id="age"
                       name="age"
                       placeholder="나이 입력"
                       min="1"
                       max="120"
                       required>
            </div>

            <div class="button-group">
                <button type="submit" id="button2"  class="submit-btn">
                    전송
                </button>
                <button type="reset"  id="button1">
                    초기화
                </button>
            </div>

        </form>
    </div>
</body>
</html>
